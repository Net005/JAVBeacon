name: JAVBeacon Realtime Sync + Subtitles
description: Sends changed scenes to JAVBeacon and lets scene pages request subtitles from JAVBeacon-Subs.
version: 1.3.0
ui:
  javascript:
    - javbeacon_subtitles.js
  css:
    - javbeacon_subtitles.css
settings:
  subs_base_url:
    displayName: JAVBeacon-Subs base URL
    description: Base URL reachable from the Stash server, for example https://subs.example.com. Do not include /api/v1/jobs.
    type: STRING
  subs_api_token:
    displayName: JAVBeacon-Subs API token
    description: Bearer token used by Stash for subtitle job requests. It is sent only by the server-side plugin.
    type: STRING
  subs_timeout_seconds:
    displayName: Request timeout (seconds)
    description: HTTP timeout for JAVBeacon-Subs requests. Defaults to 30 seconds.
    type: NUMBER
  subs_recursive:
    displayName: Recursive
    description: Process inputs recursively. Defaults to false for the single scene file.
    type: BOOLEAN
  subs_overwrite:
    displayName: Overwrite
    description: Replace subtitle files that already exist. Defaults to false.
    type: BOOLEAN
  subs_auto_detect_release:
    displayName: Auto-detect release
    description: Detect the release from the scene filename. Defaults to true.
    type: BOOLEAN
  subs_release_within_days:
    displayName: Release within days
    description: Restrict release matching to this many days. Defaults to 0.
    type: NUMBER
  subs_debug_mode:
    displayName: Debug mode
    description: Enable JAVBeacon-Subs debug mode for submitted jobs. Defaults to true.
    type: BOOLEAN
  subs_keep_japanese:
    displayName: Keep Japanese
    description: Preserve Japanese subtitle tracks. Defaults to true.
    type: BOOLEAN
  subs_write_ass:
    displayName: Write ASS
    description: Ask JAVBeacon-Subs to write ASS output. Defaults to false.
    type: BOOLEAN
  subs_job_options:
    displayName: Job options (JSON)
    description: Optional advanced JSON overrides for the JAVBeacon-Subs request. Blank uses the individual settings and documented defaults. inputs is always controlled by the current scene.
    type: STRING
exec:
  - python3
  - "{pluginDir}/javbeacon_realtime.py"
interface: raw
errLog: debug
tasks:
  - name: Test JAVBeacon connection
    description: Verifies the URL and webhook secret and records the test in both Stash and JAVBeacon logs.
    defaultArgs:
      mode: test
      javbeacon_url: "http://javbeacon:8080"
      webhook_secret: "CHANGE_ME_TO_THE_SAME_LONG_RANDOM_SECRET"
      timeout_seconds: 10
hooks:
  - name: Sync created or changed scene to JAVBeacon
    description: Queues only the affected scene; repeated updates are coalesced by JAVBeacon.
    triggeredBy:
      - Scene.Create.Post
      - Scene.Update.Post
      - Scene.Destroy.Post
    defaultArgs:
      mode: hook
      # Use the URL Stash can reach. In Docker this is normally the JAVBeacon
      # service/container name, not localhost.
      javbeacon_url: "http://javbeacon:8080"
      # Must exactly match Settings > StashApp > Changed-scene sync.
      webhook_secret: "CHANGE_ME_TO_THE_SAME_LONG_RANDOM_SECRET"
      timeout_seconds: 10
