name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/net005/javbeacon

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release version
        shell: bash
        run: |
          expected="v$(tr -d '[:space:]' < internal/version/VERSION)"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($expected)" >&2
            exit 1
          }

      - name: Test
        run: go test -mod=mod ./...

      - name: Validate Docker Compose stack
        run: docker compose --env-file .env.example config --quiet

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: container-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and publish container package
        id: container-push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.container-meta.outputs.tags }}
          labels: ${{ steps.container-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest container package
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.container-push.outputs.digest }}
          push-to-registry: true

      - name: Build release binaries
        shell: bash
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            output="dist/javbeacon_${GITHUB_REF_NAME}_${os}_${arch}"
            if [ "$os" = windows ]; then output="${output}.exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -mod=mod -trimpath \
              -ldflags="-s -w -X github.com/Net005/JAVBeacon/internal/version.Value=${GITHUB_REF_NAME}" \
              -o "$output" ./cmd/javbeacon
          done
          cd dist
          sha256sum javbeacon_* > SHA256SUMS

      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --target "$GITHUB_SHA" --title "JAVBeacon $GITHUB_REF_NAME" --generate-notes --latest
