services:
  javbeacon:
    build:
      context: .
      args:
        VERSION: ${JAVBEACON_VERSION:-1.0.2}
    image: ghcr.io/net005/javbeacon:${JAVBEACON_VERSION:-1.0.2}
    container_name: javbeacon
    restart: unless-stopped
    environment:
      JAVBEACON_LISTEN: :8080
      JAVBEACON_COVERS: /app/data/covers
      JAVBEACON_INITIAL_USERNAME: ${JAVBEACON_INITIAL_USERNAME:-admin}
      JAVBEACON_INITIAL_PASSWORD: ${JAVBEACON_INITIAL_PASSWORD:?JAVBEACON_INITIAL_PASSWORD must be set in .env}
      JAVBEACON_API_KEY: ${JAVBEACON_API_KEY:-}
      JAVBEACON_PAGE_LIMIT: ${JAVBEACON_PAGE_LIMIT:-5}
      JAVBEACON_DB_ENGINE: postgres
      JAVBEACON_DB_HOST: postgres
      JAVBEACON_DB_PORT: 5432
      JAVBEACON_DB_NAME: ${POSTGRES_DB:-javbeacon}
      JAVBEACON_DB_USER: ${POSTGRES_USER:-javbeacon}
      JAVBEACON_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      JAVBEACON_DB_SSLMODE: disable
      # The setting keeps its historical FlareSolverr name, but Byparr is the
      # included and recommended compatible solver.
      JAVBEACON_FLARESOLVERR_URL: http://byparr:8191/v1
    depends_on:
      postgres:
        condition: service_healthy
      byparr:
        condition: service_healthy
    ports:
      - "${JAVBEACON_PORT:-8080}:8080"
    volumes:
      - javbeacon-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:18
    container_name: javbeacon-postgres
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-javbeacon}
      POSTGRES_USER: ${POSTGRES_USER:-javbeacon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8"
    volumes:
      - ${POSTGRES_DATA_PATH:-./data/postgres}:/var/lib/postgresql
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-2048MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-6144MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-512MB}
      - -c
      - autovacuum_work_mem=${POSTGRES_AUTOVACUUM_WORK_MEM:-256MB}
      - -c
      - random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}
      - -c
      - default_statistics_target=${POSTGRES_DEFAULT_STATISTICS_TARGET:-200}
      - -c
      - wal_compression=${POSTGRES_WAL_COMPRESSION:-on}
      - -c
      - min_wal_size=${POSTGRES_MIN_WAL_SIZE:-2GB}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-8GB}
      - -c
      - checkpoint_completion_target=${POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}
      - -c
      - autovacuum_max_workers=${POSTGRES_AUTOVACUUM_MAX_WORKERS:-5}
      - -c
      - autovacuum_naptime=${POSTGRES_AUTOVACUUM_NAPTIME:-30s}
      - -c
      - autovacuum_vacuum_scale_factor=${POSTGRES_AUTOVACUUM_VACUUM_SCALE_FACTOR:-0.05}
      - -c
      - autovacuum_analyze_scale_factor=${POSTGRES_AUTOVACUUM_ANALYZE_SCALE_FACTOR:-0.02}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 1m

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: javbeacon-byparr
    restart: unless-stopped
    shm_size: "512mb"
    environment:
      HOST: 0.0.0.0
      PORT: 8191
      LOG_LEVEL: ${BYPARR_LOG_LEVEL:-INFO}
    ports:
      # Loopback-only publishing allows local health checks and API docs
      # without exposing Byparr to the network.
      - "${BYPARR_BIND_ADDRESS:-127.0.0.1}:${BYPARR_PORT:-8191}:8191"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8191/health"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 20s

volumes:
  javbeacon-data:
